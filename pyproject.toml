[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-stock-engine"
version = "0.1.0"
description = "NSE stock data ingestion and technical analysis engine"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "pandas>=2.2,<3",
    "numpy>=2.1,<3",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "tenacity>=9,<10",
    "python-dateutil>=2.9,<3",
]

[project.scripts]
nse-engine = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
